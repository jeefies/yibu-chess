name: Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108' 'cmake;3.22.1'
      - name: Restore stable personal test signing
        env:
          YIBU_KEYSTORE_BASE64: ${{ secrets.YIBU_KEYSTORE_BASE64 }}
        run: |
          mkdir -p signing
          if [ -z "$YIBU_KEYSTORE_BASE64" ]; then
            echo 'Configure YIBU_KEYSTORE_BASE64 with the backed-up personal test key so APK updates keep the same signature.'
            exit 1
          fi
          printf '%s' "$YIBU_KEYSTORE_BASE64" | base64 --decode > signing/personal.jks
      - name: Test and assemble
        run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: yibu-arm64-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
